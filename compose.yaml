name: restosphere

services:
  postgres:
    # Postgres 18+ doi duong dan volume sang /var/lib/postgresql, nho sua volume ben duoi neu nang version.
    image: 'postgres:17-alpine'
    environment:
      POSTGRES_DB: ${DB_NAME:-restosphere_v2}
      POSTGRES_USER: ${DB_USERNAME:-restosphere}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-restosphere}
    ports:
      - '${DB_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
