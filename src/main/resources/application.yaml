spring:
  application:
    name: restosphere_be_springboot

  config:
    # Nap bien moi truong tu file .env o thu muc goc khi chay local (file nay khong commit).
    import: optional:file:.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:restosphere_v2}
    username: ${DB_USERNAME:restosphere}
    password: ${DB_PASSWORD:restosphere}

  sql:
    init:
      # Seed di qua Flyway (db/seed, chi profile dev); khong dung dataset.sql nua.
      mode: never

  jpa:
    open-in-view: false
    hibernate:
      # Schema do Flyway quan ly (db/migration); Hibernate chi kiem tra, khong tu sua.
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration

  docker:
    compose:
      # Tu dong start compose.yaml khi chay app, va giu database chay khi app tat.
      lifecycle-management: start-only

  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

app:
  cloudinary:
    enabled: ${CLOUDINARY_ENABLED:false}
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}

  mail:
    enabled: ${MAIL_ENABLED:false}
    from: ${MAIL_FROM:}
    login-url: ${STAFF_LOGIN_URL:http://localhost:5173/staff/login}

  security:
    jwt:
      issuer: ${JWT_ISSUER:restosphere}
      # Bat buoc, toi thieu 32 ky tu. Khong dat gia tri mac dinh de tranh dung nham secret dev tren production.
      secret: ${JWT_SECRET:}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
      refresh-token-ttl: ${JWT_REFRESH_TOKEN_TTL:7d}
    bootstrap-admin:
      email: ${ADMIN_EMAIL:}
      password: ${ADMIN_PASSWORD:}

  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8081}

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:false}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:false}

server:
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
